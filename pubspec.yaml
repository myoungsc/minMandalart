name: mandalart
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Local Database
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0

  # UI Utilities
  intl: ^0.20.2

  # Localization
  easy_localization: ^3.0.7
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

  # Database Testing
  sqflite_common_ffi: ^2.3.0
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/translations/

# 앱 아이콘 생성: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/AppIcon-light.png
  image_path_ios_dark_transparent: assets/icon/AppIcon-dark.png
  image_path_ios_tinted_grayscale: assets/icon/AppIcon-tinted.png
  adaptive_icon_background: assets/icon/Android-background.png
  adaptive_icon_foreground: assets/icon/Android-foreground.png
  adaptive_icon_monochrome: assets/icon/Android-monochrome.png
  # 전경 이미지가 이미 안전 영역(지름 66dp) 안에 맞춰져 있어 여백을 더하지 않는다.
  adaptive_icon_foreground_inset: 0
